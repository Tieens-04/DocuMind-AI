server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:native}
  tomcat:
    max-swallow-size: 64MB
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto

spring:
  application:
    name: documind-backend
  threads:
    virtual:
      enabled: true
  http:
    client:
      connect-timeout: ${HTTP_CLIENT_CONNECT_TIMEOUT:10s}
      read-timeout: ${HTTP_CLIENT_READ_TIMEOUT:90s}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
      file-size-threshold: 2MB
  config:
    import: optional:file:${DOCUMIND_ENV_FILE:.env}[.properties],optional:file:../${DOCUMIND_ENV_FILE:.env}[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:documind}
    username: ${POSTGRES_USER:documind}
    password: ${POSTGRES_PASSWORD:documind_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      # Session-level init SQL requires session pooling; switch to transaction-scoped SET LOCAL if behind PgBouncer transaction pooling
      connection-init-sql: SET hnsw.iterative_scan = 'relaxed_order'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      repositories:
        enabled: false
  ai:
    model:
      chat: openai
      embedding: ollama
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
    openai:
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai}
      api-key: ${GROQ_API_KEY:unconfigured-api-key}
      chat:
        options:
          model: ${GROQ_CHAT_MODEL:openai/gpt-oss-120b}
          temperature: 0.1
    vectorstore:
      pgvector:
        initialize-schema: false
        schema-validation: true
        schema-name: public
        table-name: document_chunks
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

documind:
  security:
    dev-caller-fallback:
      enabled: false
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:documind-ai}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
  ai:
    gemini:
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      completions-path: ${GEMINI_COMPLETIONS_PATH:/chat/completions}
      api-key: ${GEMINI_API_KEY:unconfigured-api-key}
      model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash}
      temperature: 0.1
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:${MINIO_API_PORT:9000}}
    access-key: ${MINIO_ROOT_USER:documind_minio}
    secret-key: ${MINIO_ROOT_PASSWORD:documind_minio_secret}
    bucket: ${MINIO_BUCKET:documind-documents}
    region: ${MINIO_REGION:us-east-1}
    upload-timeout: 60s
    presigned-expiry: 15m
  ingestion:
    extraction:
      max-spool-bytes: 52428800
      max-extracted-chars: 5000000
      zip-min-inflate-ratio: 0.01
      zip-max-entry-size-bytes: 104857600
      zip-max-file-count: 1000
    chunking:
      # Calibrated on live bge-m3 (DA-11 Milestone 1: 100% Hit@5, +0.0813 OOS margin)
      chunk-size: ${INGESTION_CHUNK_SIZE:512}
      chunk-overlap: ${INGESTION_CHUNK_OVERLAP:100}
      max-chunks-per-document: 10000
    worker:
      enabled: true
      max-concurrent-documents: 10
      batch-size: 50
      max-concurrent-batches: 10
      max-attempts: 3
      initial-backoff: 500ms
      backoff-multiplier: 2.0
      max-backoff: 5s
      recovery-stale-after: 15m
      recovery-poll-interval-ms: 60000
  rag:
    retrieval:
      top-k: ${RAG_TOP_K:5}
      similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.58}
      overfetch-multiplier: 2
      max-excerpt-chars: 500
    llm:
      max-question-chars: 4000
      fallback-enabled: true
