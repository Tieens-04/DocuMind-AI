server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: documind-backend
  threads:
    virtual:
      enabled: true
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:documind}
    username: ${POSTGRES_USER:documind}
    password: ${POSTGRES_PASSWORD:documind_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  ai:
    model:
      chat: openai
      embedding: ollama
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
    openai:
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai}
      api-key: ${GROQ_API_KEY:unconfigured-api-key}
      chat:
        options:
          model: ${GROQ_CHAT_MODEL:llama-3.3-70b-versatile}
          temperature: 0.1
    vectorstore:
      pgvector:
        initialize-schema: false
        schema-name: public
        table-name: document_chunks
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

documind:
  ai:
    gemini:
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      completions-path: ${GEMINI_COMPLETIONS_PATH:/chat/completions}
      api-key: ${GEMINI_API_KEY:unconfigured-api-key}
      model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
      temperature: 0.1
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:${MINIO_API_PORT:9000}}
    access-key: ${MINIO_ROOT_USER:documind_minio}
    secret-key: ${MINIO_ROOT_PASSWORD:documind_minio_secret}
    bucket: ${MINIO_BUCKET:documind-documents}
    region: ${MINIO_REGION:us-east-1}
