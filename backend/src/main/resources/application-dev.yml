# Local development profile: opts in to dev seed data (V3 preserved immutable; future seeds must use R__*.sql)
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    out-of-order: true

documind:
  security:
    dev-caller-fallback:
      enabled: false
    jwt:
      secret: ${JWT_SECRET:documind-local-dev-jwt-hmac-secret-key-min-32-bytes-2026}
