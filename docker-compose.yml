name: documind-ai

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    container_name: documind-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-documind}
      POSTGRES_USER: ${POSTGRES_USER:-documind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-documind_secret}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "max_connections=100"
    volumes:
      - documind_pgdata:/var/lib/postgresql/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-documind} -d ${POSTGRES_DB:-documind}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: documind-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "192mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    volumes:
      - documind_redisdata:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:634c989a2f1029162fc2676c263caa181213b9410449968532f750a6fb77532d
    container_name: documind-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-documind_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-documind_minio_secret}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - documind_miniodata:/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: documind-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8081}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-3002},http://127.0.0.1:${FRONTEND_PORT:-3002}}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-documind}
      POSTGRES_USER: ${POSTGRES_USER:-documind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-documind_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:${MINIO_API_PORT:-9000}}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${SERVER_PORT:-8081}}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-documind_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-documind_minio_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-documind-documents}
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
      INGESTION_CHUNK_SIZE: ${INGESTION_CHUNK_SIZE:-512}
      INGESTION_CHUNK_OVERLAP: ${INGESTION_CHUNK_OVERLAP:-100}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0.58}
      RAG_SSE_TIMEOUT: ${RAG_SSE_TIMEOUT:-120s}
      RAG_CACHE_ENABLED: ${RAG_CACHE_ENABLED:-true}
      RAG_CACHE_L1_TTL: ${RAG_CACHE_L1_TTL:-30m}
      RAG_CACHE_L2_TTL: ${RAG_CACHE_L2_TTL:-24h}
      RAG_CACHE_SEMANTIC_THRESHOLD: ${RAG_CACHE_SEMANTIC_THRESHOLD:-0.94}
      RAG_CACHE_VERSION_TTL: ${RAG_CACHE_VERSION_TTL:-24h}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_EXPIRATION_BUFFER: ${RATE_LIMIT_EXPIRATION_BUFFER:-10s}
      RATE_LIMIT_CHAT_PERIOD: ${RATE_LIMIT_CHAT_PERIOD:-1m}
      RATE_LIMIT_CHAT_VIEWER: ${RATE_LIMIT_CHAT_VIEWER:-15}
      RATE_LIMIT_CHAT_MANAGER: ${RATE_LIMIT_CHAT_MANAGER:-30}
      RATE_LIMIT_CHAT_ADMIN: ${RATE_LIMIT_CHAT_ADMIN:-60}
      RATE_LIMIT_UPLOAD_PERIOD: ${RATE_LIMIT_UPLOAD_PERIOD:-1m}
      RATE_LIMIT_UPLOAD_MANAGER: ${RATE_LIMIT_UPLOAD_MANAGER:-5}
      RATE_LIMIT_UPLOAD_ADMIN: ${RATE_LIMIT_UPLOAD_ADMIN:-10}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai}
      GROQ_API_KEY: ${GROQ_API_KEY:-unconfigured-api-key}
      GROQ_CHAT_MODEL: ${GROQ_CHAT_MODEL:-openai/gpt-oss-120b}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      GEMINI_COMPLETIONS_PATH: ${GEMINI_COMPLETIONS_PATH:-/chat/completions}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-unconfigured-api-key}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-documind-ai}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-7d}
    mem_limit: 1280m
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${SERVER_PORT:-8081}}
        NEXT_PUBLIC_DEMO_ACCOUNTS: ${NEXT_PUBLIC_DEMO_ACCOUNTS:-true}
    container_name: documind-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3002}:3000"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev@sha256:072cfdbce847a7ca180687745004c41d1165b57db178be357f73bc1c12143351
    container_name: documind-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-documind_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-documind_minio_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-documind-documents}
    entrypoint:
      - "/bin/sh"
      - "-c"
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET" &&
        mc anonymous set none "local/$$MINIO_BUCKET"

volumes:
  documind_pgdata:
  documind_redisdata:
  documind_miniodata:
